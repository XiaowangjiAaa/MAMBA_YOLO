# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object segmentation model with Mamba backbone.

# Parameters
nc: 1  # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary
  s: [0.33, 0.50, 1024]  # YOLOv8s summary
  m: [0.67, 0.75, 768]   # YOLOv8m summary
  l: [1.00, 1.00, 512]   # YOLOv8l summary
  x: [1.00, 1.25, 512]   # YOLOv8x summary

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  # args: [hidden_dim, drop_path]
  - [-1, 1, SimpleStem, [128, 3]]       # 0-P2/4
  - [-1, 3, VSSBlock, [128, 0.0]]       # 1
  - [-1, 1, VisionClueMerge, [256]]     # 2 p3/8
  - [-1, 3, VSSBlock, [256, 0.0]]       # 3
  - [-1, 1, VisionClueMerge, [512]]     # 4 p4/16
  - [-1, 9, VSSBlock, [512, 0.0]]       # 5
  - [-1, 1, VisionClueMerge, [1024]]    # 6 p5/32
  - [-1, 3, VSSBlock, [1024, 0.0]]      # 7
  - [-1, 1, SPPF, [1024, 5]]            # 8

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]           # cat backbone P4
  - [-1, 3, VSSBlock, [512, 0.0]]       # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]           # cat backbone P3
  - [-1, 3, VSSBlock, [256, 0.0]]       # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]          # cat head P4
  - [-1, 3, VSSBlock, [512, 0.0]]       # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]           # cat head P5
  - [-1, 3, VSSBlock, [1024, 0.0]]      # 20 (P5/32-large)

  - [[14, 17, 20], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5)