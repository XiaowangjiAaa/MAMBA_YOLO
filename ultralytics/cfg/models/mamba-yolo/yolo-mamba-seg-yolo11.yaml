
# Mamba-YOLO Segmentation based on YOLO11 architecture
# YOLO11 improvements: C2PSA spatial attention + v11Segment head (DWConv)
# Backbone/Neck: VSSBlock (SSM blocks), Head: v11Segment (DWConv mask + class branches)

nc: 80  # number of classes
scales:   # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]   # nano
  s: [0.33, 0.50, 1024]   # small
  m: [0.67, 0.75, 768]    # medium
  l: [1.00, 1.00, 512]    # large
  x: [1.00, 1.25, 512]    # xlarge

# Mamba-YOLO backbone (YOLO11-style with C2PSA after SPPF)
backbone:
  - [-1, 1, SimpleStem, [128, 3]]         # 0-P2/4
  - [-1, 3, VSSBlock, [128]]              # 1
  - [-1, 1, VisionClueMerge, [256]]       # 2-P3/8
  - [-1, 3, VSSBlock, [256]]              # 3
  - [-1, 1, VisionClueMerge, [512]]       # 4-P4/16
  - [-1, 9, VSSBlock, [512]]              # 5
  - [-1, 1, VisionClueMerge, [1024]]      # 6-P5/32
  - [-1, 3, VSSBlock, [1024]]             # 7
  - [-1, 1, SPPF, [1024, 5]]             # 8
  - [-1, 2, C2PSA, [1024]]               # 9  ← YOLO11

# Mamba-YOLO neck + segmentation head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]             # cat backbone P4
  - [-1, 3, VSSBlock, [512]]              # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]             # cat backbone P3
  - [-1, 3, VSSBlock, [256]]              # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]            # cat head P4
  - [-1, 3, VSSBlock, [512]]              # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]             # cat head P5 (from C2PSA)
  - [-1, 3, VSSBlock, [1024]]             # 21 (P5/32-large)

  - [[15, 18, 21], 1, v11Segment, [nc, 32, 256]]  # 22 ← YOLO11: DWConv seg head
