# Memory location ablation M4: supervised probability/write gates at both P3 and P4.
# Compare with the single-stage P3/P4 runs; more gates may amplify background despite multi-scale cues.
nc: 1
guidance_loss_weight: 0.05
guidance_dice_weight: 0.5
scales: {n: [0.33, 0.25, 1024], s: [0.33, 0.50, 1024], m: [0.67, 0.75, 768], l: [1.00, 1.00, 512], x: [1.00, 1.25, 512]}
backbone:
  - [-1, 1, SimpleStem, [128, 3]]
  - [-1, 3, VSSBlock, [128]]
  - [-1, 1, VisionClueMerge, [256]]
  - [-1, 3, CrackWriteVSSBlock, [256]]  # P3 write gate
  - [-1, 1, VisionClueMerge, [512]]
  - [-1, 9, CrackWriteVSSBlock, [512]]  # P4 write gate
  - [-1, 1, VisionClueMerge, [1024]]
  - [-1, 3, VSSBlock, [1024]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, VSSBlock, [512]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, VSSBlock, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, VSSBlock, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, VSSBlock, [1024]]
  - [[15, 18, 21], 1, v11Segment, [nc, 32, 256]]
