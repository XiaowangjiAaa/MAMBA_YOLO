
# Mamba-YOLO-L based on YOLO11 architecture
# YOLO11 improvements: C2PSA spatial attention + v11Detect head (DWConv)

nc: 80
scales:
  L: [1.00, 1.00, 1024]  # Mamba-YOLO-L: 57.6M params, 156.2G FLOPs

backbone:
  - [-1, 1, SimpleStem, [128, 3]]        # 0-P2/4
  - [-1, 3, VSSBlock, [128]]             # 1
  - [-1, 1, VisionClueMerge, [256]]      # 2-P3/8
  - [-1, 3, VSSBlock, [256]]             # 3
  - [-1, 1, VisionClueMerge, [512]]      # 4-P4/16
  - [-1, 9, VSSBlock, [512]]             # 5
  - [-1, 1, VisionClueMerge, [1024]]     # 6-P5/32
  - [-1, 3, VSSBlock, [1024]]            # 7
  - [-1, 1, SPPF, [1024, 5]]            # 8
  - [-1, 2, C2PSA, [1024]]              # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, XSSBlock, [512]]             # 12
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, XSSBlock, [256]]             # 15 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, XSSBlock, [512]]             # 18 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, XSSBlock, [1024]]            # 21 (P5/32-large)
  - [[15, 18, 21], 1, v11Detect, [nc]]   # 22
