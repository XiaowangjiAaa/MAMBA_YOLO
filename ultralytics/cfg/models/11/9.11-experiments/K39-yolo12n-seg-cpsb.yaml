# YOLO12n-Seg: C3k2/A2C2f-compatible CPSB shells replace all four backbone feature blocks.
nc: 1
scale: n
guidance_loss_weight: 0.1
guidance_dice_weight: 1.0
orientation_loss_weight: 0.01
connectivity_loss_weight: 0.03
scales: {n: [0.50, 0.25, 1024]}
c3p2: &c3p2 [256, False, 0.25, 0.25, 0.02, 128, 3, 0.05, 0.02, 0.50, 8, 0.05, 0.50, 0.05, 0.50, 0.05, 0.25, 3, 0.01, True, adaptive, poc, full, True]
c3p3: &c3p3 [512, False, 0.25, 0.25, 0.02, 128, 3, 0.05, 0.02, 0.50, 8, 0.05, 0.50, 0.05, 0.50, 0.05, 0.25, 3, 0.01, True, adaptive, poc, full, True]
a2p4: &a2p4 [512, True, 4, False, 2.0, 0.5, 1, True, 0.25, 0.02, 128, 3, 0.05, 0.02, 0.50, 8, 0.05, 0.50, 0.05, 0.50, 0.05, 0.25, 3, 0.01, adaptive, poc, full, True]
a2p5: &a2p5 [1024, True, 1, False, 2.0, 0.5, 1, True, 0.25, 0.02, 128, 3, 0.05, 0.02, 0.50, 8, 0.05, 0.50, 0.05, 0.50, 0.05, 0.25, 3, 0.01, adaptive, poc, full, True]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, AdaptiveC3k2CrackPath, *c3p2]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, AdaptiveC3k2CrackPath, *c3p3]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, AdaptiveA2C2fCrackPath, *a2p4]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, AdaptiveA2C2fCrackPath, *a2p5]
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[14, 17, 20], 1, Segment, [nc, 32, 256]]
